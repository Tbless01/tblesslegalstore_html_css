<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer | TLS Legal Store</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #e74c3c;
            --primary-dark: #c0392b;
            --secondary: #34495e;
            --light-bg: #f8f9fa;
            --border: #dee2e6;
            --text-muted: #6c757d;
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 20px;
            padding-bottom: 20px;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .logo-container {
            text-align: center;
            padding: 20px 0;
        }

        .navbar-logo {
            height: 100px;
            width: auto;
            transition: transform 0.3s ease;
        }

        .navbar-logo:hover {
            transform: scale(1.05);
        }

        .card-title {
            color: var(--secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
            font-size: 1.8rem;
            position: relative;
            display: inline-block;
        }

        .card-title:after {
            content: '';
            position: absolute;
            width: 50px;
            height: 3px;
            background-color: var(--primary);
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .btn-primary, .btn-login {
            background-color: var(--primary);
            border-color: var(--primary);
            border-radius: 30px;
            padding: 10px 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(231, 76, 60, 0.2);
        }

        .btn-primary:hover, .btn-login:hover {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(231, 76, 60, 0.3);
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            height: auto;
            border: 2px solid var(--border);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(231, 76, 60, 0.25);
        }

        .form-label {
            color: var(--secondary);
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }

        .required:after {
            content: '*';
            color: var(--primary);
            margin-left: 4px;
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 43px;
            color: var(--text-muted);
        }

        .divider {
            height: 1px;
            background-color: var(--border);
            margin: 30px 0;
        }

        .alert {
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 20px;
        }

        .save-btn-container {
            margin-top: 30px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card">
                <div class="card-body p-md-5">
                    <div class="logo-container">
                        <img class="navbar-logo" src="assets/img/portfolio/thumbnails/TLS_LOGO.PNG" alt="TLS Logo" />
                    </div>

                    <h2 class="card-title text-center">Add Customer</h2>

                    <a href="index.html" class="btn btn-primary mb-4 btn-back">
                        <i class="fas fa-arrow-left"></i> Back to Home
                    </a>

                    <form id="registerForm">
                        <div class="form-group">
                            <label for="email" class="form-label required">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                            <div class="input-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter first name">
                            <div class="input-icon">
                                <i class="fas fa-user"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Enter last name">
                            <div class="input-icon">
                                <i class="fas fa-user"></i>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="phoneNumber" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="e.g., 08109872837">
                            <div class="input-icon">
                                <i class="fas fa-phone-alt"></i>
                            </div>
                        </div>

                        <div class="divider"></div>

                        <div class="save-btn-container text-center">
                            <button class="btn btn-login btn-lg px-5" type="submit">
                                <i class="fas fa-save mr-2"></i> Save Customer
                            </button>
                        </div>

                        <div class="alert" id="responseAlert" role="alert"></div>
                    </form>

                    <p class="footer-text mt-4">
                        TLS Legal Store &copy; 2025. All rights reserved.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const formData = new FormData(this);
        const customerRegRequest = {
            email: formData.get('email'),
            phoneNumber: formData.get('phoneNumber') || '',
            firstName: formData.get('firstName') || '',
            lastName: formData.get('lastName') || ''
        };

        // Show loading state
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Processing...';
        submitBtn.disabled = true;

        // Get the JWT token from localStorage
        const token = localStorage.getItem('authToken');

        // fetch('https://doubtful-bellanca-tbless01-141bda75.koyeb.app/tblesslegalstore/v1/api/customers', {
        fetch('https://doubtful-bellanca-tbless01-141bda75.koyeb.app/tblesslegalstore/v1/api/customers', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(customerRegRequest)
        })
            .then(response => response.json())
            .then(data => {
                const alert = document.getElementById('responseAlert');
                alert.textContent = data.message;
                alert.style.display = 'block';

                if (data.status === 200) {
                    alert.className = 'alert alert-success';
                    alert.innerHTML = '<i class="fas fa-check-circle mr-2"></i> ' + data.message;

                    // Reset form on success
                    document.getElementById('registerForm').reset();

                    // Redirect after showing success message
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    alert.className = 'alert alert-danger';
                    alert.innerHTML = '<i class="fas fa-exclamation-circle mr-2"></i> ' + data.message;
                }

                // Restore button state
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                const alert = document.getElementById('responseAlert');
                alert.className = 'alert alert-danger';
                alert.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i> An error occurred while registering the customer.';
                alert.style.display = 'block';

                // Restore button state
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
            });
    });
</script>
</body>
</html>
