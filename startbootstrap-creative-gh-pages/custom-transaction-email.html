    <div class="container-fluid ps-md-0">
        <div class="row g-0">
            <div class="d-none d-md-flex col-md-4 col-lg-6 bg-image"></div>
            <div class="col-md-8 col-lg-6">
                <div class="login d-flex align-items-center py-5">
                    <div class="container">
                        <div class="row">
                            <div class="col-md-9 col-lg-8 mx-auto">
                                <h3 class="login-heading mb-4">Send Custom Transaction Email</h3>
                                <!-- Custom Transaction Email Form -->
                                <form id="transactionEmailForm">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" name="customerName" id="floatingName" placeholder="Optional: Your Name">
                                        <label for="floatingName">Recipient Name (Optional)</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control" name="customerEmail" id="floatingEmail" placeholder="name@example.com" required>
                                        <label for="floatingEmail">Recipient Email</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" name="discount" id="floatingDiscount" placeholder="Discount" required>
                                        <label for="floatingDiscount">Discount</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" name="voucherCode" id="floatingVoucher" placeholder="Voucher Code" required>
                                        <label for="floatingVoucher">Voucher Code</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" name="packageName" id="floatingPackage" placeholder="Package Name" required>
                                        <label for="floatingPackage">Package Name</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="number" class="form-control" name="amount" id="floatingAmount" placeholder="Amount" required>
                                        <label for="floatingAmount">Package Amount</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="number" class="form-control" name="totalAmountPaid" id="floatingTotal" placeholder="Total Amount Paid" required>
                                        <label for="floatingTotal">Total Amount Paid</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="number" class="form-control" name="lastPayment" id="floatingLastPayment" placeholder="Last Payment" required>
                                        <label for="floatingLastPayment">Last Payment</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="number" class="form-control" name="balance" id="floatingBalance" placeholder="Balance" required>
                                        <label for="floatingBalance">Balance</label>
                                    </div>
                                    <div class="d-grid">
                                        <button class="btn btn-lg btn-primary btn-login text-uppercase fw-bold mb-2" type="submit">Send Transaction Email</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer text-faded text-center py-5">
        <div class="container"><p class="m-0 small">Copyright &copy; TLS 2024</p></div>
    </footer>
    <!-- Bootstrap core JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS -->
    <script src="/startbootstrap-creative-gh-pages/landing_and_admin/startbootstrap-business-casual-gh-pages/js/scripts.js"></script>
    <!-- Import Configuration and Handle Form Submission -->
    <script type="module">
        const BASE_URL = 'https://doubtful-bellanca-tbless01-141bda75.koyeb.app/tblesslegalstore/v1/api';
        // const BASE_URL = 'http://localhost:8000/tblesslegalstore/v1/api';

        document.getElementById('transactionEmailForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const customerName = document.querySelector('input[name="customerName"]').value;
            const customerEmail = document.querySelector('input[name="customerEmail"]').value;
            const discount = document.querySelector('input[name="discount"]').value;
            const voucherCode = document.querySelector('input[name="voucherCode"]').value;
            const packageName = document.querySelector('input[name="packageName"]').value;
            const amount = document.querySelector('input[name="amount"]').value;
            const totalAmountPaid = document.querySelector('input[name="totalAmountPaid"]').value;
            const lastPayment = document.querySelector('input[name="lastPayment"]').value;
            const balance = document.querySelector('input[name="balance"]').value;
            const authToken = localStorage.getItem('authToken');

            // Show loading indicator
            const loadingIndicator = document.createElement('div');
            loadingIndicator.textContent = 'Sending transaction email...';
            document.body.appendChild(loadingIndicator);

            fetch(`${BASE_URL}/custom/transaction`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({
                    customerName: customerName,
                    customerEmail: customerEmail,
                    discount: discount,
                    voucherCode: voucherCode,
                    packageName: packageName,
                    amount: amount,
                    totalAmountPaid: totalAmountPaid,
                    lastPayment: lastPayment,
                    balance: balance,
                }),
            })
            .then(response => {
                // Remove loading indicator
                document.body.removeChild(loadingIndicator);
                return response.json();
            })
            .then(data => {
                if (!data.cancelled) { // Check if cancelled is false
                    alert('Transaction email sent successfully!');
                } else {
                    alert('Failed to send transaction email: ' + data.message);
                }
            })
            .catch(error => {
                // // Remove loading indicator
                document.body.removeChild(loadingIndicator);
                alert('An error occurred while sending the transaction email. Please try again later.');
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
