<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --accent-color: #e74c3c;
            --light-bg: #f8f9fa;
            --dark-bg: #343a40;
            --white: #ffffff;
            --border-radius: 12px;
            --box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding-bottom: 40px;
        }

        .page-header {
            background-color: var(--white);
            padding: 20px 0;
            box-shadow: var(--box-shadow);
            margin-bottom: 30px;
        }

        .navbar-logo {
            height: 80px;
            width: auto;
        }

        .section-title {
            color: var(--secondary-color);
            font-weight: 600;
            margin-bottom: 20px;
            position: relative;
            padding-bottom: 10px;
        }

        .section-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            background-color: var(--accent-color);
        }

        .card {
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            transition: var(--transition);
            overflow: hidden;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }

        .card-header {
            background-color: var(--primary-color);
            color: var(--white);
            font-weight: 600;
            padding: 15px 20px;
            border: none;
        }

        .card-body {
            padding: 20px;
        }

        .customer-info {
            margin-bottom: 15px;
        }

        .info-label {
            font-weight: 600;
            color: var(--secondary-color);
            margin-bottom: 3px;
        }

        .info-value {
            color: #555;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 8px 20px;
            border-radius: 50px;
            transition: var(--transition);
        }

        .btn-primary:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }

        .btn-danger {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            padding: 8px 20px;
            border-radius: 50px;
            transition: var(--transition);
        }

        .btn-danger:hover {
            background-color: #c0392b;
            border-color: #c0392b;
        }

        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 8px 20px;
            border-radius: 50px;
            transition: var(--transition);
        }

        .btn-outline-primary:hover {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .action-btns {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .pagination {
            margin-top: 30px;
        }

        .page-link {
            color: var(--primary-color);
            border-radius: 50%;
            margin: 0 5px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-item.active .page-link {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .modal-content {
            border-radius: var(--border-radius);
            border: none;
            box-shadow: var(--box-shadow);
        }

        .modal-header {
            background-color: var(--primary-color);
            color: var(--white);
            border-bottom: none;
            border-top-left-radius: var(--border-radius);
            border-top-right-radius: var(--border-radius);
        }

        .modal-title {
            font-weight: 600;
        }

        .modal-footer {
            border-top: 1px solid #eee;
        }

        .form-control {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
        }

        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            border-color: var(--primary-color);
        }

        .form-label {
            font-weight: 600;
            color: var(--secondary-color);
        }

        .btn-floating {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: var(--transition);
            z-index: 100;
        }

        .btn-floating:hover {
            background-color: #2980b9;
            transform: scale(1.1);
        }

        .btn-floating i {
            font-size: 24px;
        }

        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            padding-left: 40px;
            border-radius: 50px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 10px;
            color: #aaa;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
        }

        .empty-state i {
            font-size: 60px;
            color: #ddd;
            margin-bottom: 20px;
        }

        .empty-state h4 {
            color: #888;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #aaa;
            max-width: 400px;
            margin: 0 auto;
        }

        .customer-count {
            background-color: var(--light-bg);
            color: var(--secondary-color);
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 600;
            margin-left: 15px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .action-btns {
                flex-direction: column;
                gap: 5px;
            }

            .action-btns .btn {
                width: 100%;
            }

            .navbar-logo {
                height: 60px;
            }
        }
    </style>
</head>

<body>
<!-- Header -->
<header class="page-header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <a href="index.html" class="d-inline-block">
                    <img class="navbar-logo" src="assets/img/portfolio/thumbnails/TLS_LOGO.PNG" alt="TLS Logo" />
                </a>
            </div>
            <nav>
                <a href="index.html" class="btn btn-outline-primary">
                    <i class="fas fa-home me-2"></i>Home
                </a>
            </nav>
        </div>
    </div>
</header>

<!-- Main Content -->
<div class="container">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="section-title">Customer Management <span class="customer-count" id="customerCount">0</span></h1>
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="form-control search-input" id="searchCustomer" placeholder="Search customers...">
                </div>
            </div>
        </div>
    </div>

    <!-- Customer List -->
    <div class="row g-4" id="customersList">
        <!-- Customer cards will be added here -->
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display: none;">
        <i class="fas fa-users"></i>
        <h4>No Customers Found</h4>
        <p>There are no customers in the database or your search didn't match any results.</p>
    </div>

    <!-- Pagination -->
    <nav aria-label="Page navigation">
        <ul id="pagination" class="pagination justify-content-center">
            <!-- Pagination buttons will be added here -->
        </ul>
    </nav>
</div>

<!-- Customer Details Modal -->
<div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="customerModalLabel">Customer Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="updateCustomerForm">
                    <div class="mb-3">
                        <label for="customerCode" class="form-label">Customer Code</label>
                        <input type="text" class="form-control" id="customerCode" disabled>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="customerEmail" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="customerEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="customerPhone" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="customerPhone" required>
                    </div>
                    <div class="mb-3">
                        <label for="customerDateRegistered" class="form-label">Date Registered</label>
                        <input type="text" class="form-control" id="customerDateRegistered" disabled>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Update Customer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmDeleteModalLabel">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="text-center mb-4">
                    <i class="fas fa-exclamation-triangle text-warning" style="font-size: 48px;"></i>
                </div>
                <p class="text-center">Are you sure you want to delete this customer? This action cannot be undone.</p>
                <p class="text-center mb-0" id="deleteCustomerInfo"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteButton">
                    <i class="fas fa-trash me-2"></i>Delete
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Add Customer Button -->
<a href="#" class="btn-floating" id="addCustomerBtn" title="Add New Customer">
    <i class="fas fa-plus"></i>
</a>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    const apiUrl = 'https://doubtful-bellanca-tbless01-141bda75.koyeb.app/tblesslegalstore/v1/api/customers/all';
    let deleteCustomerCode = '';
    let deleteCustomerName = '';
    let allCustomers = [];
    let currentPage = 0;
    let pageSize = 8; // Increased page size

    function getAuthToken() {
        return localStorage.getItem('authToken');
    }

    async function fetchCustomers(pageNumber = 0, pageSize = 8) {
        try {
            const token = getAuthToken();
            const response = await fetch(`${apiUrl}?pageNumber=${pageNumber}&pageSize=${pageSize}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            const data = await response.json();

            if (data.status === 200) {
                allCustomers = data.data;
                displayCustomers(data.data);
                setupPagination(pageNumber, pageSize, data.totalCount);
                updateCustomerCount(data.totalCount);
            } else {
                console.error('Failed to fetch customers:', data.message);
                showEmptyState(true);
            }
        } catch (error) {
            console.error('Error fetching customers:', error);
            showEmptyState(true);
        }
    }

    function updateCustomerCount(count) {
        document.getElementById('customerCount').textContent = count;
    }

    function showEmptyState(show) {
        const emptyState = document.getElementById('emptyState');
        if (show) {
            emptyState.style.display = 'block';
        } else {
            emptyState.style.display = 'none';
        }
    }

    function displayCustomers(customers) {
        const customersList = document.getElementById('customersList');
        customersList.innerHTML = '';

        if (customers.length === 0) {
            showEmptyState(true);
            return;
        }

        showEmptyState(false);

        customers.forEach(customer => {
            const customerHtml = `
                    <div class="col-lg-6 col-xl-4">
                        <div class="card h-100">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span>${customer.firstName} ${customer.lastName}</span>
                                <span class="badge bg-light text-dark">${customer.customerCode}</span>
                            </div>
                            <div class="card-body">
                                <div class="customer-info">
                                    <div class="info-label"><i class="fas fa-envelope me-2"></i>Email</div>
                                    <div class="info-value">${customer.email}</div>
                                </div>
                                <div class="customer-info">
                                    <div class="info-label"><i class="fas fa-phone me-2"></i>Phone</div>
                                    <div class="info-value">${customer.phoneNumber}</div>
                                </div>
                                <div class="customer-info">
                                    <div class="info-label"><i class="fas fa-calendar me-2"></i>Registered</div>
                                    <div class="info-value">${new Date(customer.dateRegistered).toLocaleDateString()}</div>
                                </div>
                                <div class="action-btns">
                                    <button class="btn btn-primary" onclick="showCustomerDetails('${customer.customerCode}', '${customer.email}', '${customer.phoneNumber}', '${customer.firstName}', '${customer.lastName}', '${customer.dateRegistered}')">
                                        <i class="fas fa-edit me-2"></i>Edit
                                    </button>
                                    <button class="btn btn-danger" onclick="showConfirmDelete('${customer.customerCode}', '${customer.firstName} ${customer.lastName}')">
                                        <i class="fas fa-trash me-2"></i>Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            customersList.innerHTML += customerHtml;
        });
    }

    function showCustomerDetails(code, email, phoneNumber, firstName, lastName, dateRegistered) {
        document.getElementById('customerCode').value = code;
        document.getElementById('customerEmail').value = email;
        document.getElementById('firstName').value = firstName;
        document.getElementById('lastName').value = lastName;
        document.getElementById('customerPhone').value = phoneNumber;
        document.getElementById('customerDateRegistered').value = new Date(dateRegistered).toLocaleDateString();

        const customerModal = new bootstrap.Modal(document.getElementById('customerModal'));
        customerModal.show();
    }

    async function updateCustomer(event) {
        event.preventDefault();

        const code = document.getElementById('customerCode').value;
        const email = document.getElementById('customerEmail').value;
        const phoneNumber = document.getElementById('customerPhone').value;
        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;

        const requestBody = {
            email: email,
            phoneNumber: phoneNumber,
            firstName: firstName,
            lastName: lastName
        };

        const token = getAuthToken();

        try {
            const response = await fetch(`https://doubtful-bellanca-tbless01-141bda75.koyeb.app/tblesslegalstore/v1/api/customers/${email}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            if (response.ok) {
                const customerModal = bootstrap.Modal.getInstance(document.getElementById('customerModal'));
                customerModal.hide();
                showToast('Customer updated successfully!', 'success');
                fetchCustomers(currentPage, pageSize);
            } else {
                showToast('Failed to update customer: ' + data.message, 'error');
                console.error('Failed to update customer:', data.message);
            }
        } catch (error) {
            showToast('Error updating customer', 'error');
            console.error('Error updating customer:', error);
        }
    }

    function showConfirmDelete(customerCode, customerName) {
        deleteCustomerCode = customerCode;
        deleteCustomerName = customerName;
        document.getElementById('deleteCustomerInfo').textContent = `Customer: ${customerName} (${customerCode})`;

        const deleteModal = new bootstrap.Modal(document.getElementById('confirmDeleteModal'));
        deleteModal.show();
    }

    async function deleteCustomer() {
        try {
            const token = getAuthToken();
            const response = await fetch(`https://doubtful-bellanca-tbless01-141bda75.koyeb.app/tblesslegalstore/v1/api/customers/remove/${deleteCustomerCode}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const deleteModal = bootstrap.Modal.getInstance(document.getElementById('confirmDeleteModal'));
                deleteModal.hide();
                showToast(`Customer ${deleteCustomerName} deleted successfully!`, 'success');
                fetchCustomers(currentPage, pageSize);
            } else {
                showToast('Failed to delete customer', 'error');
                console.error('Failed to delete customer');
            }
        } catch (error) {
            showToast('Error deleting customer', 'error');
            console.error('Error deleting customer:', error);
        }
    }

    function setupPagination(pageNumber, pageSize, totalCount) {
        currentPage = pageNumber;
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        const totalPages = Math.ceil(totalCount / pageSize);

        // Previous button
        const prevLi = document.createElement('li');
        prevLi.className = 'page-item' + (pageNumber === 0 ? ' disabled' : '');
        prevLi.innerHTML = `<a class="page-link" href="#" aria-label="Previous" onclick="fetchCustomers(${pageNumber - 1}, ${pageSize}); return false;">
                <span aria-hidden="true">&laquo;</span>
            </a>`;
        pagination.appendChild(prevLi);

        // Page numbers
        let startPage = Math.max(0, pageNumber - 2);
        let endPage = Math.min(totalPages - 1, pageNumber + 2);

        if (endPage - startPage < 4) {
            if (startPage === 0) {
                endPage = Math.min(totalPages - 1, 4);
            } else if (endPage === totalPages - 1) {
                startPage = Math.max(0, totalPages - 5);
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            const pageButton = document.createElement('li');
            pageButton.className = 'page-item';
            if (i === pageNumber) {
                pageButton.classList.add('active');
            }
            pageButton.innerHTML = `<a class="page-link" href="#" onclick="fetchCustomers(${i}, ${pageSize}); return false;">${i + 1}</a>`;
            pagination.appendChild(pageButton);
        }

        // Next button
        const nextLi = document.createElement('li');
        nextLi.className = 'page-item' + (pageNumber === totalPages - 1 ? ' disabled' : '');
        nextLi.innerHTML = `<a class="page-link" href="#" aria-label="Next" onclick="fetchCustomers(${pageNumber + 1}, ${pageSize}); return false;">
                <span aria-hidden="true">&raquo;</span>
            </a>`;
        pagination.appendChild(nextLi);
    }

    function filterCustomers() {
        const searchTerm = document.getElementById('searchCustomer').value.toLowerCase();

        if (!searchTerm) {
            displayCustomers(allCustomers);
            return;
        }

        const filteredCustomers = allCustomers.filter(customer =>
            customer.firstName.toLowerCase().includes(searchTerm) ||
            customer.lastName.toLowerCase().includes(searchTerm) ||
            customer.email.toLowerCase().includes(searchTerm) ||
            customer.phoneNumber.toLowerCase().includes(searchTerm) ||
            customer.customerCode.toLowerCase().includes(searchTerm)
        );

        displayCustomers(filteredCustomers);
    }

    function showToast(message, type = 'info') {
        // Create toast container if it doesn't exist
        if (!document.getElementById('toastContainer')) {
            const toastContainer = document.createElement('div');
            toastContainer.id = 'toastContainer';
            toastContainer.className = 'toast-container position-fixed bottom-0 end-0 p-3';
            document.body.appendChild(toastContainer);
        }

        const toastId = 'toast-' + Date.now();
        const toastHTML = `
                <div id="${toastId}" class="toast align-items-center text-white bg-${type === 'success' ? 'success' : type === 'error' ? 'danger' : 'primary'} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">
                            ${message}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            `;

        document.getElementById('toastContainer').insertAdjacentHTML('beforeend', toastHTML);
        const toastElement = document.getElementById(toastId);
        const toast = new bootstrap.Toast(toastElement, { delay: 3000 });
        toast.show();

        // Remove the toast after it's hidden
        toastElement.addEventListener('hidden.bs.toast', function () {
            toastElement.remove();
        });
    }

    // Event Listeners
    document.getElementById('confirmDeleteButton').addEventListener('click', deleteCustomer);
    document.getElementById('updateCustomerForm').addEventListener('submit', updateCustomer);
    document.getElementById('searchCustomer').addEventListener('input', filterCustomers);
    document.getElementById('addCustomerBtn').addEventListener('click', function() {
        // In a real application, this would open a new customer form
        showToast('Add customer functionality would be implemented here', 'info');
    });

    // Initialize the page
    document.addEventListener('DOMContentLoaded', function() {
        fetchCustomers();
    });
</script>
</body>

</html>
