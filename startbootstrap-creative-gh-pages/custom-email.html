<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Send Custom Email</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Google fonts -->
    <link href="https://fonts.googleapis.com/css?family=Raleway:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap) -->
    <link href="css/tstyles.css" rel="stylesheet" />

        .spinner-border {
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="site-heading text-center text-faded d-none d-lg-block">
            <span class="site-heading-upper text-primary mb-3">Premium Legal Attire for Professionals</span>
            <span class="site-heading-lower">Tbless Legal Store</span>
        </h1>
    </header>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark py-lg-4" id="mainNav">
        <div class="container">
            <a class="navbar-brand text-uppercase fw-bold d-lg-none" href="home.html">TLS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="home.html">Home</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="about.html">About</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="products.html">Packages</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="store.html">Store</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="login-admin.html">Login</a></li>
                    <li class="nav-item px-lg-4"><a class="nav-link text-uppercase" href="customer-select-package.html">Choose Your Package</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container-fluid ps-md-0">
        <div class="row g-0">
            <div class="d-none d-md-flex col-md-4 col-lg-6 bg-image"></div>
            <div class="col-md-8 col-lg-6">
                <div class="login d-flex align-items-center py-5">
                    <div class="container">
                        <div class="row">
                            <div class="col-md-9 col-lg-8 mx-auto">
                                <h3 class="login-heading mb-4">Send Custom Email</h3>
                                <!-- Custom Email Form -->
                                <form id="emailForm">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" name="customerName" id="floatingName" placeholder="Optional: Your Name">
                                        <label for="floatingName">Recipient Name (Optional)</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="email" class="form-control" name="customerEmail" id="floatingEmail" placeholder="name@example.com" required>
                                        <label for="floatingEmail">Recipient Email</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" name="subject" id="floatingSubject" placeholder="Subject" required>
                                        <label for="floatingSubject">Subject</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <textarea class="form-control" name="message" id="floatingMessage" placeholder="Message" required></textarea>
                                        <label for="floatingMessage">Message</label>
                                    </div>
                                    <div class="d-grid">
                                        <button class="btn btn-lg btn-primary btn-login text-uppercase fw-bold mb-2" type="submit">
                                            Send Email
                                            <span class="spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true"></span>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer text-faded text-center py-5">
        <div class="container"><p class="m-0 small">Copyright &copy; TLS 2024</p></div>
    </footer>
    <!-- Bootstrap core JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS -->
    <script src="/startbootstrap-creative-gh-pages/landing_and_admin/startbootstrap-business-casual-gh-pages/js/scripts.js"></script>
    <!-- Import Configuration and Handle Form Submission -->
    <script type="module">
        const BASE_URL = 'https://doubtful-bellanca-tbless01-141bda75.koyeb.app/tblesslegalstore/v1/api';
        // const BASE_URL = 'http://localhost:8000/tblesslegalstore/v1/api';
        
        document.getElementById('emailForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const customerName = document.querySelector('input[name="customerName"]').value;
            const customerEmail = document.querySelector('input[name="customerEmail"]').value;
            const subject = document.querySelector('input[name="subject"]').value;
            const message = document.querySelector('textarea[name="message"]').value;
            const authToken = localStorage.getItem('authToken');

            const submitButton = event.target.querySelector('button[type="submit"]');
            const spinner = submitButton.querySelector('.spinner-border');

            // Show spinner and disable button
            spinner.style.display = 'inline-block';
            submitButton.disabled = true;

            fetch(`${BASE_URL}/custom`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify({
                    customerName: customerName,
                    customerEmail: customerEmail,
                    subject: subject,
                    message: message,
                }),
            })
            .then(response => response.json())
            .then(data => {
                // Hide spinner and enable button
                spinner.style.display = 'none';
                submitButton.disabled = false;

                if (!data.cancelled) { // Check if cancelled is false
                    alert('Email sent successfully!');
                } else {
                    alert('Failed to send email: ' + data.message);
                }
            })
            .catch(error => {
                // console.error('Error:', error);
                // Hide spinner and enable button
                spinner.style.display = 'none';
                submitButton.disabled = false;
            });
        });
    </script>
</body>
</html>
