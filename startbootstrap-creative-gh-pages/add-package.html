<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Add New Package</title>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            color: #495057;
        }

        .page-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .form-container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 2.5rem;
            border-radius: 16px;
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
            overflow: hidden;
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #e74c3c, #ff7675);
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .navbar-logo {
            height: 90px;
            width: auto;
            transition: transform 0.3s ease;
        }

        .navbar-logo:hover {
            transform: scale(1.05);
        }

        h2 {
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none;
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn i {
            margin-right: 6px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            color: #2d3436;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #e1e5eb;
            font-size: 1rem;
            font-weight: 400;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.15);
        }

        .form-control::placeholder {
            color: #adb5bd;
            font-weight: 300;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 15px;
            color: #adb5bd;
        }

        .input-icon input {
            padding-left: 45px;
        }

        .submit-btn {
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1rem;
        }

        .alert {
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .alert i {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading spinner */
        .spinner {
            display: none;
            margin: 0 auto;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(231, 76, 60, 0.2);
            border-top-color: #e74c3c;
            border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
<div class="page-container">
    <div class="form-container fade-in">
        <div class="logo-container">
            <img class="navbar-logo" src="assets/img/portfolio/thumbnails/TLS_LOGO.PNG" alt="TLS Logo" />
        </div>
        <h2>Add New Package</h2>

        <div class="nav-buttons">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i> Home
            </a>
            <a href="packages-list.html" class="btn btn-primary">
                <i class="fas fa-list"></i> Package List
            </a>
        </div>

        <form id="packageForm">
            <div class="form-group">
                <label for="packageName" class="form-label">Package Name</label>
                <div class="input-icon">
                    <i class="fas fa-box"></i>
                    <input type="text" class="form-control" id="packageName" name="packageName"
                           placeholder="Enter package name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="totalAmount" class="form-label">Total Amount</label>
                <div class="input-icon">
                    <i class="fas fa-dollar-sign"></i>
                    <input type="number" step="0.01" class="form-control" id="totalAmount"
                           name="totalAmount" placeholder="Enter total amount" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block submit-btn">
                <i class="fas fa-plus-circle"></i> Add Package
            </button>
        </form>

        <div id="spinner" class="spinner mt-4"></div>
        <div id="responseMessage" class="mt-3"></div>
    </div>
</div>

<script type="module">
    import { BASE_URL } from './js/config.js';

    const authToken = localStorage.getItem('authToken');
    const form = document.getElementById('packageForm');
    const spinner = document.getElementById('spinner');
    const responseMessage = document.getElementById('responseMessage');

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        // Show spinner, hide any previous messages
        spinner.style.display = 'block';
        responseMessage.innerHTML = '';

        const packageName = document.getElementById('packageName').value;
        const totalAmount = parseFloat(document.getElementById('totalAmount').value);

        const packageRequest = {
            packageName: packageName,
            totalAmount: totalAmount
        };

        try {
            const response = await fetch(`${BASE_URL}/packages`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify(packageRequest)
            });

            const data = await response.json();

            // Hide spinner
            spinner.style.display = 'none';

            if (response.ok) {
                responseMessage.innerHTML = `
                        <div class="alert alert-success fade-in">
                            <i class="fas fa-check-circle"></i>
                            ${data.message}
                        </div>`;
                form.reset();

                // Redirect after success
                setTimeout(() => {
                    window.location.href = 'packages-list.html';
                }, 2000);
            } else {
                responseMessage.innerHTML = `
                        <div class="alert alert-danger fade-in">
                            <i class="fas fa-exclamation-circle"></i>
                            Error: ${data.message}
                        </div>`;
            }
        } catch (error) {
            console.error('Error adding package:', error);
            spinner.style.display = 'none';
            responseMessage.innerHTML = `
                    <div class="alert alert-danger fade-in">
                        <i class="fas fa-exclamation-triangle"></i>
                        Network error. Please check your connection and try again.
                    </div>`;
        }
    });
</script>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
